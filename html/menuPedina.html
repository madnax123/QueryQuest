<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QueryQuest | Selezione giocatore</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; overflow: hidden;
      color: #eaf2ff; font-family: Orbitron, sans-serif;
      background: #080b16;
    }
    #background {
      position: fixed; inset: 0; z-index: -2;
      overflow: hidden; 
      background:
        radial-gradient(circle at 20% 20%, #172c59 0, transparent 35%),
        radial-gradient(circle at 80% 70%, #35134d 0, transparent 38%),
        linear-gradient(135deg, #050914, #10142a 55%, #080714);
    }
    #background::after {
      content: ""; position: absolute; inset: 0;
      background: linear-gradient(90deg, #00e5ff12, transparent 45%, #ff38d012);
    }
    .blob {
  position: absolute;
  border-radius: 50%;
  filter: blur(40px);
  opacity: .55;
  mix-blend-mode: screen;
  will-change: transform;
}
.blob:nth-child(1) { width: 380px; height: 380px; background: #00e5ff; left: 5%;  bottom: -200px; animation: sali1 22s ease-in-out infinite alternate; }
.blob:nth-child(2) { width: 300px; height: 300px; background: #b13cff; left: 35%; bottom: -180px; animation: sali2 28s ease-in-out infinite alternate; }
.blob:nth-child(3) { width: 420px; height: 420px; background: #ff38d0; left: 60%; bottom: -220px; animation: sali3 25s ease-in-out infinite alternate; }
.blob:nth-child(4) { width: 240px; height: 240px; background: #4d6bff; left: 80%; bottom: -160px; animation: sali1 19s ease-in-out infinite alternate-reverse; }
.blob:nth-child(5) { width: 200px; height: 200px; background: #00e5ff; left: 20%; bottom: -140px; animation: sali2 31s ease-in-out infinite alternate-reverse; }

@keyframes sali1 {
  0%   { transform: translate(0, 0) scale(1); }
  50%  { transform: translate(60px, -60vh) scale(1.3, .85); }
  100% { transform: translate(-40px, -105vh) scale(.9, 1.2); }
}
@keyframes sali2 {
  0%   { transform: translate(0, 0) scale(1.1); }
  50%  { transform: translate(-80px, -50vh) scale(.8, 1.25); }
  100% { transform: translate(50px, -110vh) scale(1.2, .9); }
}
@keyframes sali3 {
  0%   { transform: translate(0, 0) scale(.9, 1.1); }
  50%  { transform: translate(40px, -70vh) scale(1.25, .9); }
  100% { transform: translate(-60px, -100vh) scale(1, 1); }
}

@media (prefers-reduced-motion: reduce) {
  .blob { animation: none; }
}
    .screen {
      min-height: 100vh; display: grid; place-items: center;
      padding: 28px;filter: drop-shadow(0 0 14px #00e5ff55);
    }
.panel {
  --cut: 28px;       /* grandezza dell'angolo */
  --bordo: 2px;      /* spessore del bordo */
  --cut-interno: calc(var(--cut) - var(--bordo) * 0.586);

  position: relative;
  isolation: isolate;
  width: min(1100px, 100%);
  padding: clamp(22px, 4vw, 42px);
  background: #00e5ff;   /* colore del bordo */
  clip-path: polygon(
    var(--cut) 0, calc(100% - var(--cut)) 0,
    100% var(--cut), 100% calc(100% - var(--cut)),
    calc(100% - var(--cut)) 100%, var(--cut) 100%,
    0 calc(100% - var(--cut)), 0 var(--cut)
  );
}

.panel::before {
  content: "";
  position: absolute;
  inset: var(--bordo);
  z-index: -1;
  background: #080b16;
  clip-path: polygon(
    var(--cut-interno) 0, calc(100% - var(--cut-interno)) 0,
    100% var(--cut-interno), 100% calc(100% - var(--cut-interno)),
    calc(100% - var(--cut-interno)) 100%, var(--cut-interno) 100%,
    0 calc(100% - var(--cut-interno)), 0 var(--cut-interno)
  );
}

    header { text-align: center; margin-bottom: 28px; }
    .logo {
      margin: 0; font-size: clamp(2rem, 5vw, 3.6rem); font-weight: 800;
      letter-spacing: .12em; color: #eaf2ff;
      text-shadow: 0 0 12px #00e5ff, 0 0 24px #a23cff;
    }
    .subtitle { color: #00e5ff; letter-spacing: .2em; font-size: .9rem; margin-top: 12px; }
    .content { display: grid; grid-template-columns: 1.25fr .8fr; gap: 24px; }
    .selection, .form-box {
      border: 1px solid #7865ff66; background: #0a1024cc;
      padding: 22px; min-width: 0;
    }
    .section-title { text-align: center; font-size: .9rem; letter-spacing: .12em; margin: 0 0 18px; }
    .preview-wrap { position: relative; height: 310px; border: 1px solid #00e5ff55; background: radial-gradient(ellipse, #00e5ff13, transparent 65%); }
    #pedinaPreview { width: 100%; height: 100%; display: block; }
    .pedina-name { text-align: center; color: #00e5ff; margin: 14px 0 0; letter-spacing: .12em; }
    .navigation { display: flex; align-items: center; justify-content: center; gap: 22px; margin-top: 16px; }
    .arrow {
      width: 44px; height: 44px; border: 1px solid #00e5ff; color: #00e5ff;
      background: #071326; font: inherit; font-size: 1.3rem; cursor: pointer;
      box-shadow: 0 0 12px #00e5ff22;
    }
    .arrow:hover, .confirm:hover { background: #00e5ff20; box-shadow: 0 0 18px #00e5ff55; }
    .counter { color: #9aa9cf; font-size: .8rem; }
    .form-box {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    gap: 18px;
    padding: 45px 22px 22px;
    min-width: 0;
}
label {
    font-size: 1.30rem;
    font-weight: 700;
    letter-spacing: .1em;
    line-height: 1.7;
    color: #eaf2ff;
    text-shadow: 0 0 10px #00e5ff55;
    margin-bottom: 5px;
}
    input {
      width: 100%; padding: 15px 13px; color: #eaf2ff; background: #050914;
      border: 1px solid #00e5ff; outline: none; font: inherit; font-size: .9rem;
      box-shadow: inset 0 0 12px #00e5ff12;
    }
    input:focus { box-shadow: 0 0 15px #00e5ff33; }
    .hint { color: #8b9abf; font-size: .7rem; line-height: 1.7; }
    .confirm {
      margin-top: 8px; padding: 15px; color: #eaf2ff; cursor: pointer;
      background: #091326; border: 1px solid #00e5ff;
      font: inherit; font-weight: 700; letter-spacing: .15em;
      text-shadow: 0 0 8px #00e5ff;
    }
    #error { min-height: 1.2em; color: #ff638d; font-size: .75rem; }
    @media (max-width: 760px) {
      body { overflow: auto; }
      .screen { padding: 14px; }
      .content { grid-template-columns: 1fr; }
      .preview-wrap { height: 240px; }
      .panel { clip-path: none; }
    }
#back{
  position:absolute;
  z-index: 10;  
  width:60px;
  height:60px;
  top: 20px;
  left: 30px;
rotate: 180deg;

}
    
  </style>
</head>
<body data-musica="../audio/Rammstein.mp3">
  <div id="background">
  <span class="blob"></span>
  <span class="blob"></span>
  <span class="blob"></span>
  <span class="blob"></span>
  <span class="blob"></span>
</div>
  <div id="back" >
    <a href="index.html">
     <img src="../queryquest_tabellone/textures/arrow.png" alt="Torna indietro" width="40" height="50"> 
    </a>
    </div>
  <main class="screen">
    <section class="panel">
      <header>
        <h1 class="logo">QUERYQUEST</h1>
        <div class="subtitle" data-it="CONFIGURAZIONE GIOCATORE" data-en="PLAYER CONFIGURATION">CONFIGURAZIONE GIOCATORE</div>
      </header>

      <div class="content">
        <section class="selection">
          <h2 class="section-title" data-it="SCEGLI LA TUA PEDINA" data-en="CHOOSE YOUR PAWN">SCEGLI LA TUA PEDINA</h2>
          <div class="preview-wrap"><canvas id="pedinaPreview"></canvas></div>
          <div class="pedina-name" id="pedinaNome"></div>
          <div class="navigation">
            <button class="arrow" id="precedente" aria-label="Pedina precedente">‹</button>
            <span class="counter" id="contatore">1 / 3</span>
            <button class="arrow" id="successivo" aria-label="Pedina successiva">›</button>
          </div>
        </section>

        <form class="form-box" id="formGiocatore">
          <label for="nomeGiocatore" data-it="INSERISCI IL TUO NOME" data-en="ENTER YOUR NAME">INSERISCI IL TUO NOME</label>
          <input id="nomeGiocatore" name="nome" maxlength="18" placeholder="Giocatore01" autocomplete="nickname" required>
          <div class="hint" data-it="Il nome e la pedina verranno salvati per la partita." data-en="The name and pawn will be saved for the game.">Il nome e la pedina verranno salvati per la partita.</div>
          <div id="error" role="status"></div>
          <button class="confirm" type="submit" href="game.html" data-it="CONFERMA E GIOCA" data-en="CONFIRM AND PLAY">CONFERMA E GIOCA</button>
        </form>
      </div>
    </section>
  </main>

  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
      "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
   
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

// ==========================================
// CONFIGURAZIONE
// ==========================================

const FILE_PEDINE = '../queryquest_tabellone/blender/pedine.glb';

const pedine = [
    {
        id: 'klaatu',
        nome: 'KLAATU',
        oggetto: 'Standee_1'
    },
    {
        id: 'barada',
        nome: 'BARADA',
        oggetto: 'Standee_2'
    },
    {
        id: 'nikto',
        nome: 'NIKTO',
        oggetto: 'Standee_3'
    }
];

// ==========================================
// SCENA 3D DELLA PREVIEW
// ==========================================

const canvas = document.getElementById('pedinaPreview');

const renderer = new THREE.WebGLRenderer({
    canvas: canvas,
    antialias: true,
    alpha: true
});

renderer.setPixelRatio(
    Math.min(window.devicePixelRatio, 2)
);

renderer.setClearColor(0x000000, 0);

const scena = new THREE.Scene();

const telecamera = new THREE.PerspectiveCamera(
    35,
    1,
    0.1,
    100
);

telecamera.position.set(0, 0, 5);
telecamera.lookAt(0, 0.2, 0);

// ==========================================
// ILLUMINAZIONE
// ==========================================

const luceAmbiente = new THREE.HemisphereLight(
    0xeaf2ff,
    0x101020,
    2
);

scena.add(luceAmbiente);

const lucePrincipale = new THREE.DirectionalLight(
    0xffffff,
    2.5
);

lucePrincipale.position.set(3, 5, 4);
scena.add(lucePrincipale);

const luceCiano = new THREE.PointLight(
    0x00e5ff,
    15,
    10
);

luceCiano.position.set(-2, 2, 2);
scena.add(luceCiano);

// ==========================================
// VARIABILI
// ==========================================

const loader = new GLTFLoader();

let indicePedina = 0;
let modelliPedine = {};
let pedinaAttuale = null;
let modelliCaricati = false;

// ==========================================
// CARICAMENTO DEL FILE GLB
// ==========================================

loader.load(
    FILE_PEDINE,

    function (gltf) {

        // Recupera i tre modelli
        pedine.forEach((pedina) => {

            const modello = gltf.scene.getObjectByName(
                pedina.oggetto
            );

            if (!modello) {
                console.error(
                    'Modello non trovato:',
                    pedina.oggetto
                );
                return;
            }

            // Clona il gruppo con tutte le sue mesh
            modelliPedine[pedina.id] = modello.clone(true);
        });

        modelliCaricati = true;

        // Mostra il primo personaggio
        mostraPedina();
    },

    undefined,

    function (errore) {
        console.error(
            'Errore nel caricamento delle pedine:',
            errore
        );

        mostraErrore('Impossibile caricare i modelli 3D.');
    }
);

// ==========================================
// MOSTRA IL PERSONAGGIO SELEZIONATO
// ==========================================

function mostraPedina() {

    if (!modelliCaricati) return;

    const pedina = pedine[indicePedina];

    // Rimuove il modello precedente
    if (pedinaAttuale) {
        scena.remove(pedinaAttuale);
        pedinaAttuale = null;
    }

    const modelloOriginale = modelliPedine[pedina.id];

    if (!modelloOriginale) {
        mostraErrore('Personaggio non disponibile.');
        return;
    }

    // Crea una nuova copia
    pedinaAttuale = modelloOriginale.clone(true);

    // Calcola dimensioni e centro
    const box = new THREE.Box3().setFromObject(
        pedinaAttuale
    );

    const centro = box.getCenter(
        new THREE.Vector3()
    );

    const dimensioni = box.getSize(
        new THREE.Vector3()
    );

    // Centra il modello nella preview
    pedinaAttuale.position.sub(centro);

    // Adatta la dimensione
    const dimensioneMassima = Math.max(
        dimensioni.x,
        dimensioni.y,
        dimensioni.z
    );

    const scala = 2.5 / (dimensioneMassima || 1);

    pedinaAttuale.scale.multiplyScalar(scala);

    // Inserisce il modello nella scena
    scena.add(pedinaAttuale);

    // Aggiorna il nome
    document.getElementById('pedinaNome').textContent =
        pedina.nome;

    // Aggiorna il contatore
    document.getElementById('contatore').textContent =
        `${indicePedina + 1} / ${pedine.length}`;

    // Rimuove eventuali errori precedenti
    mostraErrore('');
}

// ==========================================
// FUNZIONE PER GLI ERRORI
// ==========================================

function mostraErrore(messaggio) {

    const elemento = document.getElementById('error');

    if (elemento) {
        elemento.textContent = messaggio;
    }

}

// ==========================================
// FRECCIA SINISTRA
// ==========================================

document.getElementById('precedente').addEventListener(
    'click',
    function () {

        if (!modelliCaricati) return;

        indicePedina--;

        if (indicePedina < 0) {
            indicePedina = pedine.length - 1;
        }

        mostraPedina();
    }
);

// ==========================================
// FRECCIA DESTRA
// ==========================================

document.getElementById('successivo').addEventListener(
    'click',
    function () {

        if (!modelliCaricati) return;

        indicePedina++;

        if (indicePedina >= pedine.length) {
            indicePedina = 0;
        }

        mostraPedina();
    }
);

// ==========================================
// CONFERMA GIOCATORE
// ==========================================

document.getElementById('formGiocatore').addEventListener(
    'submit',
    function (event) {

        event.preventDefault();

        if (!modelliCaricati) {
            mostraErrore('Attendi il caricamento delle pedine.');
            return;
        }

        const nome = document
            .getElementById('nomeGiocatore')
            .value
            .trim();

        if (!nome) {
            mostraErrore('Inserisci il tuo nome!');
            return;
        }

        const giocatore = {
            nome: nome,
            pedinaId: pedine[indicePedina].id,
            pedinaNome: pedine[indicePedina].nome,
            pedinaOggetto: pedine[indicePedina].oggetto
        };

        // Salva i dati del giocatore
        sessionStorage.setItem(
            'queryquestGiocatore',
            JSON.stringify(giocatore)
        );

        // Avvia la partita
        window.location.href = 'game.html';
    }
);

// ==========================================
// RIDIMENSIONAMENTO DELLA PREVIEW
// ==========================================

function ridimensiona() {

    const larghezza = canvas.clientWidth;
    const altezza = canvas.clientHeight;

    if (!larghezza || !altezza) return;

    renderer.setSize(
        larghezza,
        altezza,
        false
    );

    telecamera.aspect = larghezza / altezza;
    telecamera.updateProjectionMatrix();
}

window.addEventListener('resize', ridimensiona);

new ResizeObserver(ridimensiona).observe(canvas);

ridimensiona();

// ==========================================
// ANIMAZIONE
// ==========================================

function anima() {

    requestAnimationFrame(anima);

    renderer.render(
        scena,
        telecamera
    );
}

anima();
  </script>

  <script src="lingue.js"></script>
  <script src="audio.js"></script>

</body>
</html>
