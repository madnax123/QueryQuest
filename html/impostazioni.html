<html lang="it">

<head>
    <meta charset="UTF-8">
    <title>Impostazioni</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400..900&display=swap" rel="stylesheet">

    <style>
        body {
            padding:0;
            margin:0;
            box-sizing: border-box;
            background-color: #000000;
            font-family: 'Orbitron', sans-serif;
        }

        label {
            color: #EAF2FF;
            font-size: 2.2em;
            font-weight: 700;

        }

        #setting {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 25px;
            margin: 200px auto 0;         /* centrato: niente margini fissi calcolati a mano */
            width: min(840px, 90%);      

            /* Pannello classico: angoli chiusi a 90°, bordo su tutto
               il perimetro — niente clip-path né tagli */
            background: rgba(5, 13, 27, 0.88);
            border: 1px solid rgba(0, 229, 255, 0.55);
            box-shadow:
                0 0 12px rgba(0, 229, 255, 0.15),
                inset 0 0 15px rgba(0, 229, 255, 0.05);
            backdrop-filter: blur(8px);

            padding: 30px 40px 40px;
            color: #EAF2FF;
        }

        /* Titolo dentro il pannello, come nei pannelli HUD in partita */
        .titolo-pannello {
            color: #00E5FF;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 3px;
            text-align: center;

            padding-bottom: 10px;
            margin-bottom: 15px;

            border-bottom: 1px solid rgba(0, 229, 255, 0.3);
            width: 100%;
        }

        input[type="range"] {
            width: min(450px, 100%);      
            height: 12px;
            background: #EAF2FF;
            border-radius: 6px;
        }

        input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #00E5FF;
        }

        /* Rende i radio button quadrati */
        input[type="radio"],
        input[type="checkbox"] {
            -webkit-appearance: none;
            /* Rimuove lo stile circolare di default */
            appearance: none;
            width: 16px;
            /* Larghezza del quadrato */
            height: 16px;
            /* Altezza del quadrato */
            border: 1px solid #555;
            /* Bordo del quadrato */
            border-radius: 4px;
            /* Angoli arrotondati (metti 0 se li vuoi spigolosi) */
            outline: none;
            cursor: pointer;
            vertical-align: middle;
            position: relative;
            background-color: #EAF2FF;
        }

        /* Cosa succede quando il quadratino viene SELEZIONATO */
        input[type="radio"]:checked,
        input[type="checkbox"]:checked {
            background-color: #00E5FF;
            /* Colore di spunta: ciano QueryQuest, non il blu del browser */
            border-color: #00E5FF;
        }

        /* Crea il segno di spunta (un piccolo pallino o un check) all'interno */
        input[type="radio"]:checked::after,
        input[type="checkbox"]:checked::after {
            content: "";
            position: absolute;
            top: -1px;
            left: 4px;
            width: 4px;
            height: 9px;
            border: solid #EAF2FF;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
        }

        #lingue {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 5px;
        }

        button strong {
            font-weight: 800;
        }

        .bottoneMenu strong {
            font-weight: 800;
        }

        button {
            /* il button NON eredita il font dal body per colpa del
               foglio di stile nascosto del browser: glielo ridiamo */
            font: inherit;
            color: inherit;

            background-color: #00E5FF;
            border: 2px solid #00b0c4;
            /* solid esplicito: vince l'outset di fabbrica */
            box-shadow: 1px 1px 15px rgba(0, 229, 255, 0.7);

            border-radius: 10px;
            padding: 10px;

            transition: transform 0.25s ease,
                background-color 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease,
                color 0.25s ease;
        }

        /* Link mascherato da bottone: stesso look di button sopra */
        .bottoneMenu {
            display: inline-flex;
            justify-content: center;
            align-items: center;

            background-color: #00E5FF;
            border: 2px solid #00b0c4;
            box-shadow: 1px 1px 15px rgba(0, 229, 255, 0.7);

            border-radius: 10px;
            padding: 10px;

            color: inherit;
            text-decoration: none;

            transition: transform 0.25s ease,
                background-color 0.25s ease,
                border-color 0.25s ease,
                box-shadow 0.25s ease;
        }

        button:hover,
        .bottoneMenu:hover {
            transform: scale(1.1);
            background-color: #D952AA;
            border-color: #D952AA;
            box-shadow: 1px 1px 15px #FF3CAC;
            color: #EAF2FF;
        }

        #volumeContainer {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
        }

        #bottoni {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
        }
    </style>

</head>


<body>

    <form id="setting">

        <div class="titolo-pannello" data-it="IMPOSTAZIONI" data-en="SETTINGS">
            IMPOSTAZIONI
        </div>

        <div id="volumeContainer">
            <label for="volume" data-it="VOLUME AUDIO: " data-en="AUDIO VOLUME: ">VOLUME AUDIO: </label>
            <input type="range" id="volume" name="volume" min="0" max="100" value="50">
        </div>

        <div id="lingue">
            <label for="lingua" data-it="LINGUA: " data-en="LANGUAGE: ">LINGUA: </label>
            <div id="linguaScelta">
                <label>
                    <input type="radio" name="lang" value="it" checked required>
                    Italiano
                </label>

                <label style="margin-left: 15px;">
                    <input type="radio" name="lang" value="en">
                    English
                </label>
            </div>
        </div>

        <div id="spiegazioniContainer">
            <label data-it="MOSTRA SPIEGAZIONI:" data-en="SHOW EXPLANATIONS:"> MOSTRA SPIEGAZIONI:</label>
            <input type="checkbox" id="spiegazioni" name="spiegazioni" checked>
        </div>


        <div id="questLogContainer">
            <label data-it="MOSTRA QUEST LOG:" data-en="SHOW QUEST LOG:"> MOSTRA QUEST LOG:</label>
            <input type="checkbox" id="questLog" name="questLog" checked>
        </div>


        <div id="bottoni">

            <button type="submit"><strong data-it="SALVA IMPOSTAZIONI" data-en="SAVE SETTINGS">SALVA
                    IMPOSTAZIONI</strong></button>

            <a class="bottoneMenu" href="index.html"><strong data-it="TORNA INDIETRO" data-en="GO BACK">TORNA
                    INDIETRO</strong></a>

        </div>


    </form>


    <audio id="musicaMenu" loop preload="auto">
        <source src="../audio/circuit-punk-game-menu.mp3" type="audio/mpeg">
    </audio>



    <script src="lingue.js"></script>
    <script src="impostazioni.js"></script>
    <script src="audio.js"></script>

</body>

</html>
